<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8E8D0"/>
      <stop offset="100%" stop-color="#E8F5EB"/>
    </linearGradient>
    <linearGradient id="grass2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5CB870"/>
      <stop offset="100%" stop-color="#3A9A50"/>
    </linearGradient>
  </defs>

  <!-- Sky / background -->
  <rect width="800" height="450" fill="url(#sky2)"/>

  <!-- City outline in background (muted) -->
  <g opacity="0.15" fill="#1A3A2A">
    <rect x="50" y="120" width="40" height="200"/>
    <rect x="100" y="90" width="55" height="230"/>
    <rect x="165" y="140" width="35" height="180"/>
    <rect x="600" y="130" width="40" height="190"/>
    <rect x="650" y="100" width="50" height="220"/>
    <rect x="710" y="140" width="40" height="180"/>
  </g>

  <!-- Ground / park area -->
  <rect x="0" y="310" width="800" height="140" fill="url(#grass2)"/>
  <!-- Path through park -->
  <path d="M0,380 Q200,360 400,365 Q600,370 800,355" fill="none" stroke="#D4C090" stroke-width="18" opacity="0.7"/>

  <!-- Shrubs/bushes -->
  <circle cx="130" cy="315" r="22" fill="#4A9A40"/>
  <circle cx="148" cy="310" r="18" fill="#5AAA50"/>
  <circle cx="115" cy="312" r="16" fill="#3A8A38"/>
  <circle cx="640" cy="314" r="20" fill="#4A9A40"/>
  <circle cx="658" cy="310" r="16" fill="#5AAA50"/>
  <circle cx="625" cy="313" r="18" fill="#3A8A38"/>

  <!-- Big tree center-left -->
  <rect x="245" y="240" width="14" height="75" fill="#7A5030"/>
  <circle cx="252" cy="220" r="48" fill="#3A8A40"/>
  <circle cx="228" cy="234" r="34" fill="#2E7A38"/>
  <circle cx="276" cy="232" r="38" fill="#3A8A40"/>
  <!-- Apples on tree -->
  <circle cx="244" cy="208" r="5" fill="#E04040" opacity="0.8"/>
  <circle cx="260" cy="215" r="5" fill="#E04040" opacity="0.8"/>
  <circle cx="252" cy="198" r="4" fill="#E04040" opacity="0.7"/>

  <!-- Tree right -->
  <rect x="545" y="248" width="12" height="65" fill="#7A5030"/>
  <circle cx="551" cy="228" r="42" fill="#3A8A40"/>
  <circle cx="530" cy="240" r="28" fill="#2E7A38"/>
  <circle cx="570" cy="238" r="32" fill="#3A8A40"/>

  <!-- Volunteers doing city activities -->

  <!-- Person 1: Planting a tree sapling -->
  <circle cx="350" cy="268" r="14" fill="#F4A261"/>
  <path d="M336,310 Q344,285 358,285 Q368,285 368,310 Z" fill="#E76F51"/>
  <!-- Shovel -->
  <line x1="372" y1="285" x2="382" y2="315" stroke="#8B6040" stroke-width="3" stroke-linecap="round"/>
  <rect x="375" y="313" width="10" height="6" rx="2" fill="#8B6040"/>
  <!-- Small sapling -->
  <line x1="345" y1="310" x2="345" y2="292" stroke="#5A9A40" stroke-width="2"/>
  <circle cx="345" cy="286" r="8" fill="#4A8A38"/>
  <circle cx="338" cy="290" r="6" fill="#3A7A30"/>

  <!-- Person 2: Picking up trash with grabber -->
  <circle cx="430" cy="270" r="14" fill="#F4C891"/>
  <path d="M418,310 Q426,287 440,287 Q450,287 450,310 Z" fill="#2E6645"/>
  <!-- Grabber tool -->
  <line x1="454" y1="285" x2="465" y2="310" stroke="#808080" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="466" cy="313" rx="5" ry="3" fill="#606060"/>
  <!-- Trash bag -->
  <ellipse cx="418" cy="316" rx="12" ry="15" fill="#FFD700" opacity="0.8"/>
  <line x1="418" y1="301" x2="416" y2="296" stroke="#B8A000" stroke-width="1.5"/>
  <line x1="420" y1="301" x2="422" y2="296" stroke="#B8A000" stroke-width="1.5"/>

  <!-- Person 3: Painting a bench (seated working) -->
  <circle cx="500" cy="272" r="13" fill="#F4B880"/>
  <path d="M488,310 Q496,288 508,288 Q518,288 516,310 Z" fill="#4A7CC0"/>
  <!-- Paint brush -->
  <line x1="520" y1="290" x2="530" y2="305" stroke="#A07840" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="521" y="303" width="12" height="5" rx="1" fill="#80C040" opacity="0.8"/>
  <!-- Bench being painted -->
  <rect x="475" y="306" width="50" height="7" rx="3" fill="#80C040" opacity="0.7"/>
  <rect x="480" y="313" width="6" height="10" fill="#70A030" opacity="0.7"/>
  <rect x="515" y="313" width="6" height="10" fill="#70A030" opacity="0.7"/>

  <!-- Flying birds -->
  <path d="M160,70 Q170,60 180,70" fill="none" stroke="#3A9A50" stroke-width="2" stroke-linecap="round"/>
  <path d="M175,62 Q185,52 195,62" fill="none" stroke="#3A9A50" stroke-width="2" stroke-linecap="round"/>
  <path d="M600,90 Q610,80 620,90" fill="none" stroke="#3A9A50" stroke-width="2" stroke-linecap="round"/>

  <!-- Sun with rays -->
  <circle cx="700" cy="80" r="38" fill="#FFE070" opacity="0.6"/>
  <circle cx="700" cy="80" r="26" fill="#FFD040" opacity="0.7"/>

  <!-- Butterflies -->
  <path d="M280,145 Q270,135 275,128 Q280,135 290,128 Q295,135 285,145Z" fill="#FF9050" opacity="0.7"/>
  <circle cx="280" cy="140" r="2" fill="#604020"/>

  <!-- Label bar -->
  <rect x="0" y="415" width="800" height="35" fill="#2E6645" opacity="0.9"/>
  <text x="400" y="437" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="Arial, sans-serif" letter-spacing="3">DIE STADTDIENER – FÜR LEBENDIGE NACHBARSCHAFTEN</text>
</svg>
