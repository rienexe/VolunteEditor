<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6A8EA8"/>
      <stop offset="100%" stop-color="#A8C0D0"/>
    </linearGradient>
    <linearGradient id="land5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A8A6A"/>
      <stop offset="100%" stop-color="#5A7050"/>
    </linearGradient>
    <linearGradient id="trainBody5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A2510"/>
      <stop offset="100%" stop-color="#1A1008"/>
    </linearGradient>
    <filter id="smoke5">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#sky5)"/>

  <!-- Dramatic sky gradient overlay -->
