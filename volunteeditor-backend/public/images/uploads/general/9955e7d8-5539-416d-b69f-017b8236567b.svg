  <ellipse cx="165" cy="110" rx="45" ry="35" fill="#D0C8C0" opacity="0.45" filter="url(#smoke5)"/>
  <ellipse cx="195" cy="82" rx="38" ry="30" fill="#C8C0B8" opacity="0.4" filter="url(#smoke5)"/>
