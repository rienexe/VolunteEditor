  <text x="745" y="273" text-anchor="middle" font-size="9" fill="white" font-weight="bold" font-family="serif" letter-spacing="1">MUSTERDORF</text>

  <!-- Label -->
  <rect x="0" y="415" width="800" height="35" fill="#1A1010" opacity="0.9"/>
  <text x="400" y="437" text-anchor="middle" font-size="14" font-weight="bold" fill="#E8D080" font-family="Georgia, serif" letter-spacing="3">MUSEUMSBAHN MUSTERDORF (MbMd)</text>
</svg>
