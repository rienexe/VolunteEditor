    <rect x="90" y="325" width="12" height="36" rx="2"/>
    <rect x="125" y="325" width="12" height="36" rx="2"/>
    <rect x="160" y="325" width="12" height="36" rx="2"/>
    <rect x="195" y="325" width="12" height="36" rx="2"/>
    <rect x="230" y="325" width="12" height="36" rx="2"/>
    <rect x="265" y="325" width="12" height="36" rx="2"/>
    <rect x="300" y="325" width="12" height="36" rx="2"/>
    <rect x="335" y="325" width="12" height="36" rx="2"/>
    <rect x="370" y="325" width="12" height="36" rx="2"/>
    <rect x="405" y="325" width="12" height="36" rx="2"/>
    <rect x="440" y="325" width="12" height="36" rx="2"/>
    <rect x="475" y="325" width="12" height="36" rx="2"/>
    <rect x="510" y="325" width="12" height="36" rx="2"/>
    <rect x="545" y="325" width="12" height="36" rx="2"/>
    <rect x="580" y="325" width="12" height="36" rx="2"/>
    <rect x="615" y="325" width="12" height="36" rx="2"/>
