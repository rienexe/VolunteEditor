  <circle cx="365" cy="333" r="14" fill="#1A0E04" stroke="#C0A030" stroke-width="2"/>
  <circle cx="365" cy="333" r="4" fill="#D0A040"/>
  <g stroke="#C0A030" stroke-width="1.5">
    <line x1="365" y1="320" x2="365" y2="311"/>
    <line x1="365" y1="346" x2="365" y2="355"/>
    <line x1="352" y1="333" x2="343" y2="333"/>
    <line x1="378" y1="333" x2="387" y2="333"/>
    <line x1="356" y1="324" x2="350" y2="318"/>
    <line x1="374" y1="342" x2="380" y2="348"/>
    <line x1="374" y1="324" x2="380" y2="318"/>
    <line x1="356" y1="342" x2="350" y2="348"/>
