  <circle cx="422" cy="333" r="14" fill="#1A0E04" stroke="#C0A030" stroke-width="2"/>
  <circle cx="422" cy="333" r="4" fill="#D0A040"/>
  <g stroke="#C0A030" stroke-width="1.5">
    <line x1="422" y1="320" x2="422" y2="311"/>
    <line x1="422" y1="346" x2="422" y2="355"/>
    <line x1="409" y1="333" x2="400" y2="333"/>
    <line x1="435" y1="333" x2="444" y2="333"/>
    <line x1="413" y1="324" x2="407" y2="318"/>
    <line x1="431" y1="342" x2="437" y2="348"/>
    <line x1="431" y1="324" x2="437" y2="318"/>
    <line x1="413" y1="342" x2="407" y2="348"/>
