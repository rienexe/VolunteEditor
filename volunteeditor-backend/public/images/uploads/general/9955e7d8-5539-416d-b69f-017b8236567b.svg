  <rect x="640" y="250" width="8" height="44" fill="#A08040" opacity="0.7"/>
  <rect x="700" y="250" width="8" height="44" fill="#A08040" opacity="0.7"/>
  <rect x="760" y="250" width="8" height="44" fill="#A08040" opacity="0.7"/>
  <!-- Platform roof -->
  <rect x="572" y="246" width="200" height="8" rx="3" fill="#906830" opacity="0.7"/>

  <!-- Station people (silhouettes) -->
  <ellipse cx="600" cy="292" rx="8" ry="12" fill="#4A3820" opacity="0.5"/>
  <circle cx="600" cy="278" r="7" fill="#4A3820" opacity="0.5"/>
  <ellipse cx="625" cy="293" rx="7" ry="11" fill="#4A3820" opacity="0.4"/>
