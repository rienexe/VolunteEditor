  <!-- Windows row -->
  <rect x="215" y="215" width="35" height="30" rx="3" fill="#B8D0E0" stroke="#C4A880" stroke-width="1"/>
  <rect x="260" y="215" width="35" height="30" rx="3" fill="#B8D0E0" stroke="#C4A880" stroke-width="1"/>
  <rect x="305" y="215" width="30" height="30" rx="3" fill="#B8D0E0" stroke="#C4A880" stroke-width="1"/>
  <rect x="215" y="258" width="35" height="30" rx="3" fill="#B8D0E0" stroke="#C4A880" stroke-width="1"/>
  <rect x="260" y="258" width="35" height="30" rx="3" fill="#B8D0E0" stroke="#C4A880" stroke-width="1"/>
