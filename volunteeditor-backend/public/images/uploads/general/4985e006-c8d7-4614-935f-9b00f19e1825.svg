    <rect x="97" y="340" width="34" height="20" rx="2"/>
    <rect x="138" y="340" width="40" height="20" rx="2"/>
    <rect x="185" y="340" width="36" height="20" rx="2"/>
    <rect x="228" y="340" width="40" height="20" rx="2"/>
    <rect x="275" y="340" width="35" height="20" rx="2"/>
    <rect x="317" y="340" width="38" height="20" rx="2"/>
    <rect x="362" y="340" width="36" height="20" rx="2"/>
    <rect x="405" y="340" width="40" height="20" rx="2"/>
    <rect x="452" y="340" width="35" height="20" rx="2"/>
    <rect x="494" y="340" width="38" height="20" rx="2"/>
    <rect x="539" y="340" width="36" height="20" rx="2"/>
    <rect x="582" y="340" width="40" height="20" rx="2"/>
    <rect x="629" y="340" width="35" height="20" rx="2"/>
    <rect x="671" y="340" width="38" height="20" rx="2"/>
    <rect x="716" y="340" width="40" height="20" rx="2"/>
    <rect x="763" y="340" width="30" height="20" rx="2"/>
