      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#C8E8F8"/>
    </linearGradient>
    <linearGradient id="cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C4B090"/>
      <stop offset="100%" stop-color="#B09870"/>
