  <ellipse cx="65" cy="297" rx="16" ry="5" fill="#604820"/>
  <rect x="58" y="290" width="14" height="10" rx="3" fill="#604820"/>

  <!-- Tourist 3 -->
  <circle cx="35" cy="305" r="13" fill="#F0B890"/>
  <path d="M23,345 Q30,323 46,323 Q55,323 51,345 Z" fill="#C06080"/>

  <!-- Info sign post -->
  <rect x="630" y="270" width="60" height="45" rx="3" fill="#F4A426"/>
  <rect x="633" y="273" width="54" height="39" rx="2" fill="#FFF0D0"/>
  <line x1="660" y1="315" x2="660" y2="340" stroke="#8B6040" stroke-width="3"/>
  <text x="660" y="288" text-anchor="middle" font-size="9" fill="#4A3820" font-family="serif" font-weight="bold">ALTES</text>
  <text x="660" y="300" text-anchor="middle" font-size="9" fill="#4A3820" font-family="serif" font-weight="bold">RATHAUS</text>
  <text x="660" y="310" text-anchor="middle" font-size="8" fill="#8A6030" font-family="serif">1648</text>

  <!-- Label -->
  <rect x="0" y="415" width="800" height="35" fill="#D4831A" opacity="0.9"/>
  <text x="400" y="437" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="Georgia, serif" letter-spacing="2">MUSTERGABE – STADTFÜHRUNGEN MUSTERSTADT</text>
