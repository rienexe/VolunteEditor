  <circle cx="130" cy="314" r="4" fill="#202020"/>
  <circle cx="130" cy="314" r="2" fill="#606080" opacity="0.8"/>

  <!-- Tourist 2 -->
  <circle cx="65" cy="308" r="13" fill="#F5D0A0"/>
  <path d="M53,345 Q60,325 76,325 Q86,325 82,345 Z" fill="#906040"/>
