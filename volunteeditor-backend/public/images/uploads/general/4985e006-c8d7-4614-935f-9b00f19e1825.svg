  <rect x="472" y="228" width="35" height="30" rx="3" fill="#B8D0E0" stroke="#C4A880" stroke-width="1"/>
  <rect x="518" y="228" width="35" height="30" rx="3" fill="#B8D0E0" stroke="#C4A880" stroke-width="1"/>
  <rect x="565" y="228" width="28" height="30" rx="3" fill="#B8D0E0" stroke="#C4A880" stroke-width="1"/>
  <rect x="472" y="268" width="35" height="30" rx="3" fill="#B8D0E0" stroke="#C4A880" stroke-width="1"/>
  <rect x="518" y="268" width="35" height="30" rx="3" fill="#B8D0E0" stroke="#C4A880" stroke-width="1"/>

  <!-- Tour guide with group -->
  <!-- Guide: holding umbrella/flag -->
  <circle cx="165" cy="302" r="15" fill="#F4A261"/>
  <path d="M150,345 Q158,320 175,320 Q185,320 182,345 Z" fill="#E76F51"/>
  <!-- Flag/umbrella pole -->
  <line x1="180" y1="318" x2="180" y2="278" stroke="#8B6040" stroke-width="2.5"/>
  <path d="M180,278 L200,280 Q200,292 180,292" fill="#F4A426" opacity="0.9"/>

  <!-- Tourist 1 -->
  <circle cx="105" cy="305" r="13" fill="#F4C090"/>
  <path d="M93,345 Q100,323 117,323 Q126,323 122,345 Z" fill="#5080C0"/>
