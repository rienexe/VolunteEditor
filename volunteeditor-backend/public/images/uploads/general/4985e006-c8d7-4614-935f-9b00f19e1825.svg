  <ellipse cx="140" cy="68" rx="48" ry="20" fill="white" opacity="0.8"/>
  <ellipse cx="65" cy="88" rx="38" ry="16" fill="white" opacity="0.7"/>
  <ellipse cx="650" cy="70" rx="70" ry="22" fill="white" opacity="0.75"/>
  <ellipse cx="700" cy="60" rx="50" ry="18" fill="white" opacity="0.7"/>

  <!-- Background buildings (historic) -->
  <!-- Far left buildings -->
  <rect x="0" y="140" width="55" height="220" fill="#D4C0A0" opacity="0.5"/>
  <polygon points="0,142 27,115 55,142" fill="#C09070" opacity="0.5"/>
  <rect x="0" y="170" width="55" height="20" fill="#C0A880" opacity="0.3"/>

