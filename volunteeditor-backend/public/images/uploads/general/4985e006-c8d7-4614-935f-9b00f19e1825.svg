  <!-- Clock hands -->
  <line x1="400" y1="160" x2="400" y2="138" stroke="#4A3820" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="400" y1="160" x2="418" y2="168" stroke="#4A3820" stroke-width="2" stroke-linecap="round"/>
  <circle cx="400" cy="160" r="3" fill="#4A3820"/>
  <!-- Clock numbers hint -->
  <text x="400" y="145" text-anchor="middle" font-size="7" fill="#8A7050" font-family="serif">12</text>
  <text x="425" y="163" text-anchor="middle" font-size="7" fill="#8A7050" font-family="serif">3</text>
  <text x="400" y="183" text-anchor="middle" font-size="7" fill="#8A7050" font-family="serif">6</text>
  <text x="376" y="163" text-anchor="middle" font-size="7" fill="#8A7050" font-family="serif">9</text>
