    <rect x="88" y="365" width="40" height="20" rx="2"/>
    <rect x="135" y="365" width="35" height="20" rx="2"/>
    <rect x="177" y="365" width="38" height="20" rx="2"/>
    <rect x="222" y="365" width="36" height="20" rx="2"/>
    <rect x="265" y="365" width="40" height="20" rx="2"/>
    <rect x="312" y="365" width="35" height="20" rx="2"/>
    <rect x="354" y="365" width="38" height="20" rx="2"/>
    <rect x="399" y="365" width="36" height="20" rx="2"/>
    <rect x="442" y="365" width="40" height="20" rx="2"/>
    <rect x="489" y="365" width="35" height="20" rx="2"/>
    <rect x="531" y="365" width="38" height="20" rx="2"/>
    <rect x="576" y="365" width="36" height="20" rx="2"/>
    <rect x="619" y="365" width="40" height="20" rx="2"/>
    <rect x="666" y="365" width="35" height="20" rx="2"/>
    <rect x="708" y="365" width="38" height="20" rx="2"/>
