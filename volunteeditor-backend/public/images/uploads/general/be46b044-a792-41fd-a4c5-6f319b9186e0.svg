  <line x1="245" y1="244" x2="300" y2="244" stroke="#C09070" stroke-width="1"/>

  <rect x="340" y="222" width="55" height="45" rx="4" fill="#B8D8E8" stroke="#C09070" stroke-width="1.5"/>
  <line x1="367" y1="222" x2="367" y2="267" stroke="#C09070" stroke-width="1"/>
  <line x1="340" y1="244" x2="395" y2="244" stroke="#C09070" stroke-width="1"/>

  <rect x="435" y="222" width="55" height="45" rx="4" fill="#B8D8E8" stroke="#C09070" stroke-width="1.5"/>
  <line x1="462" y1="222" x2="462" y2="267" stroke="#C09070" stroke-width="1"/>
  <line x1="435" y1="244" x2="490" y2="244" stroke="#C09070" stroke-width="1"/>

  <!-- Door -->
  <rect x="368" y="272" width="64" height="48" rx="6" fill="#C08060"/>
  <rect x="372" y="276" width="56" height="40" rx="4" fill="#B07050"/>
  <circle cx="393" cy="298" r="4" fill="#D4A050"/>
  <circle cx="407" cy="298" r="4" fill="#D4A050"/>

  <!-- People on bench -->
  <!-- Bench -->
  <rect x="155" y="295" width="80" height="8" rx="3" fill="#A0784A"/>
  <rect x="163" y="303" width="8" height="15" fill="#A0784A"/>
  <rect x="219" y="303" width="8" height="15" fill="#A0784A"/>

  <!-- Elder person 1 sitting -->
  <circle cx="180" cy="278" r="12" fill="#F5C8A0"/>
  <path d="M168,295 Q175,285 188,285 Q198,285 198,298 L168,298 Z" fill="#8090C0"/>
  <!-- Cane -->
  <line x1="198" y1="298" x2="210" y2="318" stroke="#A0784A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Elder person 2 sitting -->
  <circle cx="218" cy="278" r="12" fill="#F0BCA0"/>
  <path d="M206,295 Q213,285 225,285 Q235,285 235,298 L206,298 Z" fill="#C09080"/>

