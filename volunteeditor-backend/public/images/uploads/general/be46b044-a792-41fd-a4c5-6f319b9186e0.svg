  <circle cx="150" cy="265" r="13" fill="#F5C8A0"/>
  <path d="M135,320 Q143,285 162,285 Q168,285 165,320 Z" fill="#80B890"/>
  <!-- Hair -->
  <path d="M137,262 Q142,252 150,250 Q158,252 163,262" fill="#604838" opacity="0.8"/>

  <!-- Tree left -->
  <rect x="90" y="235" width="12" height="75" fill="#8B6040"/>
  <circle cx="96" cy="215" r="40" fill="#5A9A50"/>
  <circle cx="76" cy="228" r="28" fill="#4A8A40"/>
  <circle cx="116" cy="225" r="30" fill="#5A9A50"/>

  <!-- Tree right -->
  <rect x="690" y="240" width="12" height="70" fill="#8B6040"/>
  <circle cx="696" cy="220" r="38" fill="#5A9A50"/>
  <circle cx="672" cy="233" r="26" fill="#4A8A40"/>
  <circle cx="716" cy="230" r="28" fill="#5A9A50"/>

  <!-- Heart sign -->
  <path d="M395,155 C395,155 388,148 383,151 C378,154 378,160 383,164 L395,174 L407,164 C412,160 412,154 407,151 C402,148 395,155 395,155Z" fill="#E85070" opacity="0.85"/>

  <!-- Label -->
  <rect x="0" y="415" width="800" height="35" fill="#C08060" opacity="0.85"/>
  <text x="400" y="437" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="Georgia, serif" letter-spacing="2">ALTERS- UND PFLEGEHEIM MUSTERDORF</text>
</svg>
