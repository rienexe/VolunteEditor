<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE8D6"/>
      <stop offset="100%" stop-color="#FFF5EE"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8E6C0"/>
      <stop offset="100%" stop-color="#A5D49A"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE8D8"/>
      <stop offset="100%" stop-color="#F5D0BC"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- Soft clouds -->
  <ellipse cx="120" cy="80" rx="70" ry="30" fill="white" opacity="0.7"/>
  <ellipse cx="170" cy="70" rx="50" ry="25" fill="white" opacity="0.7"/>
  <ellipse cx="80" cy="88" rx="40" ry="20" fill="white" opacity="0.6"/>
  <ellipse cx="600" cy="60" rx="80" ry="28" fill="white" opacity="0.65"/>
  <ellipse cx="660" cy="52" rx="55" ry="22" fill="white" opacity="0.6"/>
  <ellipse cx="720" cy="68" rx="45" ry="18" fill="white" opacity="0.55"/>

  <!-- Sun -->
  <circle cx="680" cy="100" r="45" fill="#FFD070" opacity="0.5"/>
  <circle cx="680" cy="100" r="32" fill="#FFE080" opacity="0.6"/>

  <!-- Ground -->
  <rect x="0" y="310" width="800" height="140" fill="url(#ground)"/>
  <!-- Path -->
  <path d="M330,450 Q370,340 400,310 Q430,340 470,450" fill="#D4C0A0" opacity="0.5"/>

  <!-- Flower beds -->
  <ellipse cx="200" cy="318" rx="60" ry="12" fill="#A8C898" opacity="0.8"/>
  <circle cx="180" cy="312" r="6" fill="#FF9090"/>
  <circle cx="195" cy="308" r="5" fill="#FFB0C0"/>
  <circle cx="210" cy="311" r="6" fill="#FF8080"/>
  <circle cx="225" cy="309" r="5" fill="#FFD0A0"/>
  <circle cx="240" cy="313" r="6" fill="#FF9090"/>

  <ellipse cx="600" cy="318" rx="60" ry="12" fill="#A8C898" opacity="0.8"/>
  <circle cx="580" cy="312" r="6" fill="#FFA0C0"/>
  <circle cx="595" cy="308" r="5" fill="#FF8080"/>
  <circle cx="610" cy="311" r="6" fill="#FFB090"/>
  <circle cx="625" cy="309" r="5" fill="#FF9090"/>

  <!-- Main building -->
  <rect x="220" y="200" width="360" height="120" fill="url(#wallGrad)" stroke="#D4A080" stroke-width="2"/>
  <!-- Roof -->
  <polygon points="200,202 400,110 600,202" fill="#D4785A" stroke="#B8603E" stroke-width="2"/>
  <!-- Roof tiles hint -->
  <g stroke="#B8603E" stroke-width="0.8" opacity="0.5">
    <line x1="260" y1="180" x2="300" y2="200"/>
    <line x1="310" y1="158" x2="360" y2="200"/>
    <line x1="370" y1="155" x2="410" y2="200"/>
    <line x1="420" y1="160" x2="460" y2="200"/>
    <line x1="480" y1="175" x2="510" y2="200"/>
  </g>
  <!-- Chimney -->
