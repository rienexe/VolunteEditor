<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nightSky8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080818"/>
      <stop offset="100%" stop-color="#1A1030"/>
    </linearGradient>
    <radialGradient id="stageLight1" cx="20%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stageLight2" cx="80%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#E040FB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E040FB" stop-opacity="0"/>
