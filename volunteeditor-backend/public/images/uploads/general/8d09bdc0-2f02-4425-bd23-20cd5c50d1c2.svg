    <rect x="75" y="10" width="70" height="28" rx="1"/>
    <rect x="150" y="10" width="70" height="28" rx="1"/>
    <rect x="225" y="10" width="70" height="28" rx="1"/>
    <rect x="300" y="10" width="70" height="28" rx="1"/>
    <rect x="375" y="10" width="70" height="28" rx="1"/>
    <rect x="450" y="10" width="70" height="28" rx="1"/>
    <rect x="525" y="10" width="70" height="28" rx="1"/>
    <rect x="600" y="10" width="70" height="28" rx="1"/>
    <rect x="675" y="10" width="70" height="28" rx="1"/>
    <rect x="750" y="10" width="50" height="28" rx="1"/>
    <rect x="36" y="42" width="70" height="28" rx="1"/>
    <rect x="110" y="42" width="70" height="28" rx="1"/>
    <rect x="185" y="42" width="70" height="28" rx="1"/>
    <rect x="260" y="42" width="70" height="28" rx="1"/>
    <rect x="335" y="42" width="70" height="28" rx="1"/>
    <rect x="410" y="42" width="70" height="28" rx="1"/>
    <rect x="485" y="42" width="70" height="28" rx="1"/>
    <rect x="560" y="42" width="70" height="28" rx="1"/>
    <rect x="635" y="42" width="70" height="28" rx="1"/>
    <rect x="710" y="42" width="70" height="28" rx="1"/>
  </g>

  <!-- Chalkboard menu on wall -->
