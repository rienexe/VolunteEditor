    <rect x="80" y="310" width="80" height="70"/>
    <rect x="160" y="310" width="80" height="70"/>
    <rect x="240" y="310" width="80" height="70"/>
    <rect x="320" y="310" width="80" height="70"/>
    <rect x="400" y="310" width="80" height="70"/>
    <rect x="480" y="310" width="80" height="70"/>
    <rect x="560" y="310" width="80" height="70"/>
    <rect x="640" y="310" width="80" height="70"/>
