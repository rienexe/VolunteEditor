  <circle cx="150" cy="12" r="4" fill="#FFE080" opacity="0.9"/>
  <circle cx="250" cy="23" r="4" fill="#FFE080" opacity="0.9"/>
  <circle cx="350" cy="12" r="4" fill="#FFE080" opacity="0.9"/>
  <circle cx="450" cy="23" r="4" fill="#FFE080" opacity="0.9"/>
  <circle cx="550" cy="12" r="4" fill="#FFE080" opacity="0.9"/>
  <circle cx="650" cy="23" r="4" fill="#FFE080" opacity="0.9"/>
  <circle cx="750" cy="12" r="4" fill="#FFE080" opacity="0.9"/>

