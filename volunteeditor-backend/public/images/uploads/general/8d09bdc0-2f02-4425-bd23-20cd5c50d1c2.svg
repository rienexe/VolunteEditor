    <rect x="320" y="380" width="80" height="70"/>
    <rect x="400" y="380" width="80" height="70"/>
    <rect x="480" y="380" width="80" height="70"/>
    <rect x="560" y="380" width="80" height="70"/>
    <rect x="640" y="380" width="80" height="70"/>
    <rect x="720" y="380" width="80" height="70"/>
  </g>

