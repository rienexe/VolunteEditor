  <rect x="68" y="33" width="184" height="124" rx="3" fill="#2E4030" opacity="0.8"/>
  <!-- Chalk menu items -->
  <text x="160" y="55" text-anchor="middle" font-size="11" fill="#F0E8C0" font-weight="bold" font-family="Georgia, serif" letter-spacing="1">HEUTE</text>
  <line x1="75" y1="60" x2="245" y2="60" stroke="#F0E8C0" stroke-width="0.8" opacity="0.6"/>
  <text x="82" y="76" font-size="9" fill="#D0C8A8" font-family="Georgia, serif">☕ Melange</text>
  <text x="82" y="90" font-size="9" fill="#D0C8A8" font-family="Georgia, serif">☕ Verlängerter</text>
  <text x="82" y="104" font-size="9" fill="#D0C8A8" font-family="Georgia, serif">🥐 Croissant</text>
  <text x="82" y="118" font-size="9" fill="#D0C8A8" font-family="Georgia, serif">🍰 Erdbeerkuchen</text>
  <text x="82" y="132" font-size="9" fill="#D0C8A8" font-family="Georgia, serif">🌱 Fair Trade Kaffee</text>
  <text x="160" y="150" text-anchor="middle" font-size="8" fill="#A8C890" font-family="sans-serif" opacity="0.8">fair gehandelt ♥</text>

