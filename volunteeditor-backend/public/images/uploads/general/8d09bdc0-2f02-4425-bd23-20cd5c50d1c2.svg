  <rect x="308" y="243" width="64" height="30" rx="2" fill="#F0E0C0" opacity="0.7"/>
  <!-- Cakes -->
  <ellipse cx="325" cy="258" rx="14" ry="9" fill="#D48860"/>
  <rect x="312" y="250" width="26" height="12" rx="2" fill="#C07040"/>
  <ellipse cx="325" cy="250" rx="13" ry="4" fill="#F0C0A0" opacity="0.8"/>
  <circle cx="325" cy="247" r="4" fill="#E04060"/>
  <!-- Second cake -->
  <ellipse cx="358" cy="258" rx="13" ry="9" fill="#8060A0"/>
  <rect x="346" y="250" width="24" height="12" rx="2" fill="#6040A0"/>
  <ellipse cx="358" cy="250" rx="12" ry="4" fill="#C0A0E0" opacity="0.8"/>

