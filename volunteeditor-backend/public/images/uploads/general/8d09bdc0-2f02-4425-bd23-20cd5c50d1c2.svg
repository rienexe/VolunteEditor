  <rect x="80" y="290" width="130" height="22" rx="4" fill="#A07040"/>
  <!-- Coffee cups on table -->
  <ellipse cx="125" cy="288" rx="10" ry="4" fill="#E8D0A0"/>
  <rect x="116" y="284" width="18" height="8" rx="3" fill="#E8D0A0"/>
  <ellipse cx="125" cy="284" rx="9" ry="3" fill="#6B3A20"/>
  <ellipse cx="165" cy="288" rx="10" ry="4" fill="#E8D0A0"/>
  <rect x="156" y="284" width="18" height="8" rx="3" fill="#E8D0A0"/>
  <ellipse cx="165" cy="284" rx="9" ry="3" fill="#6B3A20"/>
  <!-- Person 1 at table -->
  <circle cx="108" cy="256" r="17" fill="#F5C0A0"/>
  <path d="M92,308 Q100,274 118,274 Q130,274 127,308 Z" fill="#4060A0"/>
  <!-- Person 2 at table -->
  <circle cx="183" cy="258" r="17" fill="#F0B080"/>
  <path d="M167,308 Q175,276 193,276 Q205,276 202,308 Z" fill="#C06040"/>

  <!-- Table 2 with one person and laptop -->
  <ellipse cx="650" cy="310" rx="60" ry="18" fill="#8B5A2B" opacity="0.8"/>
  <rect x="590" y="292" width="120" height="20" rx="4" fill="#A07040"/>
  <!-- Laptop on table -->
  <rect x="620" y="270" width="75" height="48" rx="3" fill="#303030"/>
  <rect x="624" y="273" width="67" height="40" rx="2" fill="#4080C0" opacity="0.8"/>
  <!-- Laptop screen glow -->
  <rect x="627" y="276" width="61" height="34" rx="1" fill="#3060A0" opacity="0.6"/>
  <rect x="615" y="318" width="85" height="5" rx="2" fill="#252525"/>
  <!-- Person at laptop -->
  <circle cx="657" cy="248" r="16" fill="#F4C890"/>
  <path d="M642,295 Q650,265 665,265 Q677,265 675,295 Z" fill="#804060"/>

  <!-- Label -->
  <rect x="0" y="415" width="800" height="35" fill="#6B3A20" opacity="0.9"/>
  <text x="400" y="437" text-anchor="middle" font-size="14" font-weight="bold" fill="#F0E0C0" font-family="Georgia, serif" letter-spacing="2">ALLES FÜR DIE BOHNE – SOZIALCAFÉ MUSTERDORF</text>
</svg>
