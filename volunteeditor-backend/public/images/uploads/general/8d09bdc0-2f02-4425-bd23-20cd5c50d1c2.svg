  <path d="M392,225 Q400,218 410,225 L412,238 L390,238 Z" fill="#F0E8D0" opacity="0.9"/>
  <!-- Hair in bun -->
  <ellipse cx="400" cy="178" rx="14" ry="10" fill="#4A3020"/>
  <circle cx="400" cy="174" r="7" fill="#3A2010"/>

  <!-- Table 1 with two people -->
