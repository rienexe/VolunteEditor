  <rect x="290" y="218" width="220" height="15" rx="3" fill="#A07040"/>
  <!-- Espresso machine -->
  <rect x="370" y="195" width="80" height="40" rx="5" fill="#404040"/>
  <rect x="376" y="200" width="68" height="26" rx="3" fill="#303030"/>
  <circle cx="400" cy="213" r="9" fill="#505050"/>
  <circle cx="400" cy="213" r="5" fill="#202020"/>
  <circle cx="430" cy="213" r="9" fill="#505050"/>
  <circle cx="430" cy="213" r="5" fill="#202020"/>
