  <!-- Window light -->
  <rect x="505" y="25" width="127" height="98" fill="white" opacity="0.15"/>
  <!-- Plants in window -->
  <rect x="520" y="208" width="12" height="12" rx="2" fill="#8B6035"/>
  <ellipse cx="526" cy="205" rx="16" ry="12" fill="#5A9040"/>
  <ellipse cx="515" cy="200" rx="12" ry="10" fill="#4A8030"/>
  <rect x="640" y="208" width="12" height="12" rx="2" fill="#8B6035"/>
  <ellipse cx="646" cy="204" rx="18" ry="13" fill="#5A9040"/>
  <ellipse cx="633" cy="200" rx="13" ry="10" fill="#4A8030"/>
  <rect x="740" y="208" width="12" height="12" rx="2" fill="#8B6035"/>
  <ellipse cx="746" cy="203" rx="15" ry="11" fill="#E04060"/>
  <ellipse cx="737" cy="200" rx="11" ry="9" fill="#C03050"/>

