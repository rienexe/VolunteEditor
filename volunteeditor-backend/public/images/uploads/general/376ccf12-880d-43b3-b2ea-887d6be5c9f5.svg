  <circle cx="328" cy="273" r="6" fill="#FF5050" opacity="0.8"/>
  <circle cx="340" cy="270" r="6" fill="#FFD040" opacity="0.8"/>
  <circle cx="352" cy="273" r="6" fill="#50B0FF" opacity="0.8"/>
  <circle cx="333" cy="283" r="6" fill="#50C860" opacity="0.8"/>
  <circle cx="349" cy="283" r="6" fill="#FF80C0" opacity="0.8"/>
