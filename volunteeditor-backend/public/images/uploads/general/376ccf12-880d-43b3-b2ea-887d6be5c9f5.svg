  <path d="M590,260 Q584,248 590,238" fill="none" stroke="#C0B8B0" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
  <path d="M600,258 Q594,244 600,232" fill="none" stroke="#C0B8B0" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <path d="M610,260 Q616,248 610,238" fill="none" stroke="#C0B8B0" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
