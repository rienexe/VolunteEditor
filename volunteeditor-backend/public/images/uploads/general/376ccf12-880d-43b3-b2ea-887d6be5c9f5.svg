  <rect x="390" y="258" width="24" height="28" rx="4" fill="#8BB8D0" opacity="0.8"/>
  <line x1="396" y1="258" x2="393" y2="238" stroke="#A07040" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="402" y1="258" x2="402" y2="235" stroke="#804020" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="408" y1="258" x2="412" y2="236" stroke="#A08040" stroke-width="2.5" stroke-linecap="round"/>
