  <circle cx="120" cy="95" r="15" fill="#50C0A0" opacity="0.6"/>
  <circle cx="95" cy="115" r="12" fill="#FFD040" opacity="0.6"/>

  <!-- Picture frame 2 -->
  <rect x="650" y="55" width="105" height="85" rx="3" fill="#8B5E3C" stroke="#6B4020" stroke-width="3"/>
  <rect x="657" y="62" width="91" height="71" fill="#E0F0FF" opacity="0.9"/>
  <!-- House drawing inside -->
  <polygon points="690,100 702,78 714,100" fill="#FF8060" opacity="0.7"/>
  <rect x="690" y="100" width="24" height="22" fill="#FFA060" opacity="0.7"/>
  <rect x="696" y="108" width="12" height="14" fill="#5080C0" opacity="0.6"/>

  <!-- Window with curtains -->
  <rect x="330" y="55" width="140" height="120" rx="4" fill="#B8D8F0" stroke="#A09070" stroke-width="3"/>
