  <path d="M632,274 Q644,274 644,282 Q644,290 632,282" fill="none" stroke="#506080" stroke-width="5"/>
  <!-- Cutting board with veggies -->
  <rect x="660" y="275" width="65" height="18" rx="3" fill="#D4A060" opacity="0.9"/>
  <circle cx="674" cy="284" r="7" fill="#FF5050" opacity="0.7"/>
  <ellipse cx="690" cy="284" rx="9" ry="6" fill="#FFA030" opacity="0.7"/>
  <circle cx="707" cy="284" r="7" fill="#60C040" opacity="0.7"/>

  <!-- Persons at activity tables -->
  <!-- Person at wood table -->
  <circle cx="130" cy="258" r="16" fill="#F5C8A0"/>
  <path d="M114,310 Q122,278 142,278 Q155,278 148,310 Z" fill="#6080B0"/>
  <path d="M114,282 Q108,270 105,260" fill="none" stroke="#6080B0" stroke-width="8" stroke-linecap="round"/>
  <circle cx="104" cy="257" r="6" fill="#F5C8A0"/>

  <!-- Person at art table -->
  <circle cx="400" cy="252" r="16" fill="#F4B880"/>
  <path d="M384,305 Q392,270 412,270 Q422,270 418,305 Z" fill="#C06090"/>
