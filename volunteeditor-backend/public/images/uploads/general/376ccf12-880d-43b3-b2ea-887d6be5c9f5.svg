  <circle cx="685" cy="255" r="16" fill="#F5C090"/>
  <path d="M669,308 Q677,274 697,274 Q708,274 704,308 Z" fill="#E08030"/>
  <!-- Chef hat hint -->
  <ellipse cx="685" cy="240" rx="14" ry="10" fill="white" opacity="0.9"/>
  <rect x="674" y="240" width="22" height="7" fill="white" opacity="0.9"/>

  <!-- Label -->
  <rect x="0" y="415" width="800" height="35" fill="#FF6B6B" opacity="0.85"/>
  <text x="400" y="437" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="Arial, sans-serif" letter-spacing="2">MITDIRUNDMIR – KREATIV · GEMEINSAM · STARK</text>
</svg>
