<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="roomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F0"/>
      <stop offset="100%" stop-color="#FFF0E0"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8D0B0"/>
      <stop offset="100%" stop-color="#D4B890"/>
    </linearGradient>
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0E0"/>
      <stop offset="100%" stop-color="#FFE8D0"/>
    </linearGradient>
  </defs>

  <!-- Background room wall -->
  <rect width="800" height="450" fill="url(#wallBg)"/>

  <!-- Floor -->
  <rect x="0" y="330" width="800" height="120" fill="url(#floorGrad)"/>
  <!-- Floor planks -->
  <g stroke="#C4A870" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="345" x2="800" y2="345"/>
    <line x1="0" y1="362" x2="800" y2="362"/>
    <line x1="0" y1="379" x2="800" y2="379"/>
    <line x1="0" y1="396" x2="800" y2="396"/>
    <line x1="150" y1="330" x2="150" y2="450"/>
    <line x1="300" y1="330" x2="300" y2="450"/>
    <line x1="450" y1="330" x2="450" y2="450"/>
    <line x1="600" y1="330" x2="600" y2="450"/>
    <line x1="750" y1="330" x2="750" y2="450"/>
