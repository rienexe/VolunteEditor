<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFBF0"/>
      <stop offset="100%" stop-color="#FFF3D0"/>
    </radialGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4A426"/>
      <stop offset="100%" stop-color="#D4831A"/>
    </linearGradient>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D5A0"/>
      <stop offset="100%" stop-color="#D4BC80"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="150" cy="150" r="140" fill="url(#bg4)"/>
  <circle cx="150" cy="150" r="138" fill="none" stroke="#F4A426" stroke-width="3"/>
  <circle cx="150" cy="150" r="132" fill="none" stroke="#F4A426" stroke-width="0.8" opacity="0.4"/>

  <!-- Stylized compass rose in background -->
  <g opacity="0.12" transform="translate(150,140)">
    <polygon points="0,-60 8,-10 0,0 -8,-10" fill="#D4831A"/>
    <polygon points="0,60 8,10 0,0 -8,10" fill="#D4831A"/>
    <polygon points="-60,0 -10,-8 0,0 -10,8" fill="#D4831A"/>
    <polygon points="60,0 10,-8 0,0 10,8" fill="#D4831A"/>
    <polygon points="0,-42 5,-7 0,0 -5,-7" fill="#F4A426"/>
    <polygon points="0,42 5,7 0,0 -5,7" fill="#F4A426"/>
    <polygon points="-42,0 -7,-5 0,0 -7,5" fill="#F4A426"/>
    <polygon points="42,0 7,-5 0,0 7,5" fill="#F4A426"/>
  </g>

  <!-- Map pin / location marker - large, central -->
  <!-- Pin body -->
  <path d="M150,70 C128,70 110,88 110,110 C110,138 150,175 150,175 C150,175 190,138 190,110 C190,88 172,70 150,70Z" fill="url(#pinGrad)" stroke="#A86010" stroke-width="2"/>

  <!-- Pin inner circle -->
  <circle cx="150" cy="110" r="22" fill="white" opacity="0.95"/>
  <circle cx="150" cy="110" r="16" fill="#F4A426" opacity="0.3"/>

  <!-- Compass needle in pin -->
  <polygon points="150,97 153,110 150,123 147,110" fill="#D4831A"/>
  <polygon points="150,97 153,110 150,107 147,110" fill="#F4A426"/>
  <circle cx="150" cy="110" r="3" fill="white"/>

  <!-- Small decorative city elements around -->
  <!-- Church/tower left -->
  <rect x="78" y="148" width="18" height="30" fill="#C09030" opacity="0.6"/>
  <polygon points="78,148 87,132 96,148" fill="#C09030" opacity="0.6"/>
  <rect x="84" y="140" width="6" height="8" fill="#C09030" opacity="0.8"/>

  <!-- Building right -->
  <rect x="200" y="152" width="22" height="26" fill="#C09030" opacity="0.5"/>
  <rect x="205" y="145" width="12" height="10" fill="#C09030" opacity="0.5"/>
  <rect x="204" y="157" width="5" height="6" fill="#FFF3D0" opacity="0.8"/>
  <rect x="213" y="157" width="5" height="6" fill="#FFF3D0" opacity="0.8"/>

  <!-- Dotted path / tour route -->
  <path d="M97,178 Q120,165 150,175 Q180,185 205,178" fill="none" stroke="#F4A426" stroke-width="2" stroke-dasharray="5,4" opacity="0.7"/>
  <circle cx="97" cy="178" r="4" fill="#F4A426" opacity="0.7"/>
  <circle cx="205" cy="178" r="4" fill="#F4A426" opacity="0.7"/>

  <!-- Text -->
  <text x="150" y="215" text-anchor="middle" font-size="26" font-weight="900" fill="#7A4A08" font-family="'Georgia', serif" letter-spacing="2">MUSTER</text>
  <text x="150" y="237" text-anchor="middle" font-size="26" font-weight="900" fill="#D4831A" font-family="'Georgia', serif" letter-spacing="2">GABE</text>
  <text x="150" y="256" text-anchor="middle" font-size="9" fill="#A86010" letter-spacing="3.5" font-family="sans-serif" opacity="0.8">STADTFÜHRUNGEN</text>
</svg>
