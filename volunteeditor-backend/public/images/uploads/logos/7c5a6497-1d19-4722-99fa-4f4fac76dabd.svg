<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3A2A"/>
      <stop offset="100%" stop-color="#0D2418"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5DBF7A"/>
      <stop offset="100%" stop-color="#3A9E58"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect x="0" y="0" width="300" height="300" fill="#3A9E58"/>
  <circle cx="150" cy="150" r="140" fill="url(#bgGrad2)"/>
  <circle cx="150" cy="150" r="136" fill="none" stroke="#3A9E58" stroke-width="2" opacity="0.6"/>
  <circle cx="150" cy="150" r="128" fill="none" stroke="#3A9E58" stroke-width="0.8" opacity="0.3"/>

  <!-- City skyline silhouette -->
  <!-- Buildings from left to right -->
  <rect x="58" y="155" width="18" height="50" fill="#2E6645"/>
  <rect x="56" y="148" width="8" height="10" fill="#2E6645"/>

  <rect x="78" y="135" width="22" height="70" fill="#2E6645"/>
  <rect x="86" y="128" width="6" height="10" fill="#2E6645"/>

  <rect x="102" y="145" width="16" height="60" fill="#2E6645"/>

  <rect x="120" y="120" width="28" height="85" fill="#3A9E58" opacity="0.8"/>
  <rect x="131" y="110" width="6" height="14" fill="#3A9E58" opacity="0.8"/>

  <rect x="150" y="128" width="20" height="77" fill="#2E6645"/>

  <rect x="172" y="138" width="24" height="67" fill="#3A9E58" opacity="0.7"/>
  <rect x="181" y="130" width="6" height="11" fill="#3A9E58" opacity="0.7"/>

  <rect x="198" y="152" width="18" height="53" fill="#2E6645"/>

  <rect x="218" y="140" width="22" height="65" fill="#2E6645"/>
  <rect x="227" y="132" width="5" height="11" fill="#2E6645"/>

  <!-- Ground line -->
  <rect x="55" y="203" width="190" height="3" fill="#3A9E58" opacity="0.5"/>

  <!-- Windows (glowing) -->
  <rect x="83" y="140" width="4" height="4" fill="#A8E8B8" opacity="0.8"/>
  <rect x="90" y="140" width="4" height="4" fill="#A8E8B8" opacity="0.6"/>
  <rect x="83" y="150" width="4" height="4" fill="#A8E8B8" opacity="0.9"/>
  <rect x="124" y="125" width="4" height="4" fill="#C8F0D0" opacity="0.9" filter="url(#glow2)"/>
  <rect x="132" y="125" width="4" height="4" fill="#C8F0D0" opacity="0.7"/>
  <rect x="124" y="134" width="4" height="4" fill="#C8F0D0" opacity="0.8"/>
  <rect x="132" y="134" width="4" height="4" fill="#C8F0D0" opacity="0.5"/>
  <rect x="176" y="145" width="4" height="4" fill="#A8E8B8" opacity="0.7"/>
  <rect x="184" y="145" width="4" height="4" fill="#A8E8B8" opacity="0.8"/>
  <rect x="221" y="145" width="4" height="4" fill="#A8E8B8" opacity="0.6"/>

  <!-- Star/sparkle icon on top building -->
  <path d="M134,102 L136,107 L141,107 L137,110 L139,115 L134,112 L129,115 L131,110 L127,107 L132,107 Z" fill="#5DBF7A" filter="url(#glow2)"/>

  <!-- Text -->
  <text x="150" y="234" text-anchor="middle" font-size="22" font-weight="900" fill="#5DBF7A" letter-spacing="3" font-family="'Arial Black', sans-serif">STADT</text>
  <text x="150" y="256" text-anchor="middle" font-size="22" font-weight="900" fill="white" letter-spacing="3" font-family="'Arial Black', sans-serif">DIENER</text>
  <text x="150" y="272" text-anchor="middle" font-size="9" fill="#5DBF7A" letter-spacing="4" opacity="0.8">DIE</text>
</svg>
