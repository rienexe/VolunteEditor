<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2E4A"/>
      <stop offset="100%" stop-color="#0D1E35"/>
    </linearGradient>
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64B5F6"/>
      <stop offset="100%" stop-color="#1976D2"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="150" cy="150" r="140" fill="url(#bg6)"/>
  <circle cx="150" cy="150" r="136" fill="none" stroke="#1976D2" stroke-width="2.5"/>
  <circle cx="150" cy="150" r="130" fill="none" stroke="#1976D2" stroke-width="0.7" opacity="0.3"/>

  <!-- Subtle grid in background -->
  <g opacity="0.06" stroke="#64B5F6" stroke-width="0.8">
    <line x1="70" y1="60" x2="70" y2="220"/>
    <line x1="100" y1="60" x2="100" y2="220"/>
    <line x1="130" y1="60" x2="130" y2="220"/>
    <line x1="160" y1="60" x2="160" y2="220"/>
    <line x1="190" y1="60" x2="190" y2="220"/>
    <line x1="220" y1="60" x2="220" y2="220"/>
    <line x1="60" y1="80" x2="240" y2="80"/>
    <line x1="60" y1="110" x2="240" y2="110"/>
    <line x1="60" y1="140" x2="240" y2="140"/>
    <line x1="60" y1="170" x2="240" y2="170"/>
    <line x1="60" y1="200" x2="240" y2="200"/>
  </g>

  <!-- Balance scale -->
  <!-- Central pillar -->
  <rect x="147" y="95" width="6" height="90" rx="3" fill="url(#scaleGrad)"/>
  <!-- Base -->
  <rect x="125" y="183" width="50" height="8" rx="4" fill="url(#scaleGrad)"/>
  <rect x="135" y="176" width="30" height="10" rx="3" fill="#1565C0"/>

  <!-- Cross beam -->
  <rect x="87" y="95" width="126" height="6" rx="3" fill="url(#scaleGrad)"/>

  <!-- Left pan strings -->
  <line x1="93" y1="101" x2="82" y2="128" stroke="#64B5F6" stroke-width="1.5"/>
  <line x1="100" y1="101" x2="110" y2="128" stroke="#64B5F6" stroke-width="1.5"/>

  <!-- Right pan strings -->
  <line x1="200" y1="101" x2="190" y2="128" stroke="#64B5F6" stroke-width="1.5"/>
  <line x1="207" y1="101" x2="218" y2="128" stroke="#64B5F6" stroke-width="1.5"/>

  <!-- Left scale pan - lower (heavier) -->
  <path d="M72,134 Q96,145 120,134" stroke="#64B5F6" stroke-width="2" fill="none"/>
  <path d="M72,134 Q96,148 120,134" fill="#0D47A1" opacity="0.7"/>

  <!-- Right scale pan - higher (lighter) -->
  <path d="M180,122 Q204,133 228,122" stroke="#64B5F6" stroke-width="2" fill="none"/>
  <path d="M180,122 Q204,136 228,122" fill="#0D47A1" opacity="0.7"/>

  <!-- Coins on left pan -->
  <ellipse cx="89" cy="135" rx="9" ry="4" fill="url(#goldGrad)"/>
  <ellipse cx="89" cy="132" rx="9" ry="4" fill="url(#goldGrad)"/>
  <text x="89" y="134" text-anchor="middle" font-size="5" fill="#5A3E00">€</text>
  <ellipse cx="107" cy="136" rx="9" ry="4" fill="url(#goldGrad)"/>
  <ellipse cx="107" cy="133" rx="9" ry="4" fill="url(#goldGrad)"/>
  <text x="107" y="135" text-anchor="middle" font-size="5" fill="#5A3E00">€</text>

  <!-- Shield / protection symbol on right pan -->
  <path d="M194,124 L204,120 L214,124 L214,132 Q204,138 194,132 Z" fill="none" stroke="#06D6A0" stroke-width="2"/>
  <path d="M198,129 L202,133 L210,125" stroke="#06D6A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pivot circle at top of pillar -->
  <circle cx="150" cy="95" r="7" fill="url(#scaleGrad)" stroke="#0D47A1" stroke-width="2"/>
  <circle cx="150" cy="95" r="3" fill="#FFD700"/>

  <!-- Upward arrow (financial growth) -->
  <path d="M150,72 L145,82 L148,80 L148,90 L152,90 L152,80 L155,82 Z" fill="#06D6A0"/>

  <!-- Text -->
  <text x="150" y="220" text-anchor="middle" font-size="22" font-weight="900" fill="white" letter-spacing="1" font-family="'Arial Black', sans-serif">BÖRSEN</text>
  <text x="150" y="243" text-anchor="middle" font-size="22" font-weight="900" fill="#64B5F6" letter-spacing="1" font-family="'Arial Black', sans-serif">SCHLUSS</text>
  <text x="150" y="262" text-anchor="middle" font-size="8.5" fill="#64B5F6" letter-spacing="3" opacity="0.7" font-family="sans-serif">SCHULDNERBERATUNG</text>
</svg>
