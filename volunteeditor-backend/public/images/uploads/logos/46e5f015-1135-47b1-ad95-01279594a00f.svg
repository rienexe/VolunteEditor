<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1C2E"/>
      <stop offset="100%" stop-color="#0E0E1A"/>
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E8E0D0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8E0D0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A3825"/>
      <stop offset="100%" stop-color="#2A2015"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#E74C3C"/>
    </linearGradient>
    <filter id="steamBlur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="150" cy="150" r="140" fill="url(#bg5)"/>

  <!-- Vintage-style decorative ring -->
  <circle cx="150" cy="150" r="136" fill="none" stroke="#C0392B" stroke-width="3"/>
  <circle cx="150" cy="150" r="130" fill="none" stroke="#8B6914" stroke-width="1" opacity="0.6"/>

  <!-- Corner ornaments -->
  <circle cx="150" cy="16" r="4" fill="#C0392B"/>
  <circle cx="150" cy="284" r="4" fill="#C0392B"/>
  <circle cx="16" cy="150" r="4" fill="#C0392B"/>
  <circle cx="284" cy="150" r="4" fill="#C0392B"/>

  <!-- Steam puffs -->
  <ellipse cx="118" cy="108" rx="12" ry="18" fill="url(#steamGrad)" filter="url(#steamBlur)"/>
  <ellipse cx="105" cy="95" rx="9" ry="14" fill="url(#steamGrad)" filter="url(#steamBlur)"/>
  <ellipse cx="125" cy="88" rx="7" ry="12" fill="url(#steamGrad)" filter="url(#steamBlur)"/>

  <!-- Track rails -->
  <rect x="45" y="192" width="210" height="4" rx="2" fill="#8B6914"/>
  <rect x="45" y="202" width="210" height="4" rx="2" fill="#8B6914"/>
  <!-- Sleepers -->
  <rect x="58" y="189" width="8" height="20" rx="1" fill="#5A3E1A"/>
  <rect x="80" y="189" width="8" height="20" rx="1" fill="#5A3E1A"/>
  <rect x="102" y="189" width="8" height="20" rx="1" fill="#5A3E1A"/>
  <rect x="124" y="189" width="8" height="20" rx="1" fill="#5A3E1A"/>
  <rect x="146" y="189" width="8" height="20" rx="1" fill="#5A3E1A"/>
  <rect x="168" y="189" width="8" height="20" rx="1" fill="#5A3E1A"/>
  <rect x="190" y="189" width="8" height="20" rx="1" fill="#5A3E1A"/>
  <rect x="212" y="189" width="8" height="20" rx="1" fill="#5A3E1A"/>

  <!-- Locomotive body -->
  <!-- Main cab -->
  <rect x="140" y="145" width="70" height="48" rx="4" fill="url(#trainGrad)" stroke="#8B6914" stroke-width="1.5"/>
  <!-- Cab window -->
  <rect x="175" y="152" width="22" height="18" rx="3" fill="#A8C8D8" opacity="0.7"/>
  <line x1="186" y1="152" x2="186" y2="170" stroke="#8B6914" stroke-width="1"/>
  <!-- Cab door -->
  <rect x="148" y="155" width="18" height="28" rx="2" fill="#3A2A15" stroke="#8B6914" stroke-width="1"/>
  <circle cx="163" cy="169" r="2" fill="#C8A030"/>

  <!-- Boiler -->
  <ellipse cx="115" cy="170" rx="30" ry="23" fill="#C0392B"/>
  <rect x="86" y="147" width="60" height="23" fill="#C0392B"/>
  <!-- Boiler bands -->
  <rect x="100" y="147" width="3" height="46" fill="#8B2015" opacity="0.6"/>
  <rect x="118" y="147" width="3" height="46" fill="#8B2015" opacity="0.6"/>
  <rect x="133" y="147" width="3" height="46" fill="#8B2015" opacity="0.6"/>

  <!-- Smokestack -->
  <rect x="108" y="122" width="14" height="28" rx="3" fill="#2A2015"/>
  <ellipse cx="115" cy="122" rx="10" ry="5" fill="#3A3025"/>

  <!-- Cowcatcher / front bumper -->
  <polygon points="86,193 70,193 76,170 86,170" fill="#8B6914"/>

  <!-- Wheels -->
  <!-- Large drive wheel -->
  <circle cx="120" cy="193" r="16" fill="#3A2A15" stroke="#8B6914" stroke-width="2"/>
  <circle cx="120" cy="193" r="10" fill="#2A1A05" stroke="#C8A030" stroke-width="1.5"/>
  <circle cx="120" cy="193" r="3" fill="#C8A030"/>
  <!-- Spokes -->
  <line x1="120" y1="183" x2="120" y2="177" stroke="#C8A030" stroke-width="1.2"/>
  <line x1="120" y1="203" x2="120" y2="209" stroke="#C8A030" stroke-width="1.2"/>
  <line x1="110" y1="193" x2="104" y2="193" stroke="#C8A030" stroke-width="1.2"/>
  <line x1="130" y1="193" x2="136" y2="193" stroke="#C8A030" stroke-width="1.2"/>
  <line x1="113" y1="186" x2="109" y2="182" stroke="#C8A030" stroke-width="1"/>
  <line x1="127" y1="200" x2="131" y2="204" stroke="#C8A030" stroke-width="1"/>
  <line x1="127" y1="186" x2="131" y2="182" stroke="#C8A030" stroke-width="1"/>
  <line x1="113" y1="200" x2="109" y2="204" stroke="#C8A030" stroke-width="1"/>

  <!-- Small front wheel -->
  <circle cx="80" cy="193" r="9" fill="#3A2A15" stroke="#8B6914" stroke-width="1.5"/>
  <circle cx="80" cy="193" r="4" fill="#2A1A05" stroke="#C8A030" stroke-width="1"/>
  <circle cx="80" cy="193" r="1.5" fill="#C8A030"/>

  <!-- Rear wheels -->
  <circle cx="165" cy="193" r="10" fill="#3A2A15" stroke="#8B6914" stroke-width="1.5"/>
  <circle cx="165" cy="193" r="5" fill="#2A1A05" stroke="#C8A030" stroke-width="1"/>
  <circle cx="195" cy="193" r="10" fill="#3A2A15" stroke="#8B6914" stroke-width="1.5"/>
  <circle cx="195" cy="193" r="5" fill="#2A1A05" stroke="#C8A030" stroke-width="1"/>

  <!-- Coupling rod -->
  <rect x="110" y="189" width="90" height="4" rx="2" fill="#8B6914"/>

  <!-- Headlight -->
  <circle cx="75" cy="162" r="6" fill="#F0D060"/>
  <circle cx="75" cy="162" r="3" fill="white" opacity="0.9"/>

  <!-- Text banner -->
  <rect x="40" y="220" width="220" height="32" rx="4" fill="#C0392B"/>
  <rect x="42" y="222" width="216" height="28" rx="3" fill="none" stroke="#E8D080" stroke-width="1"/>
  <text x="150" y="237" text-anchor="middle" font-size="10" font-weight="bold" fill="#F0E8C0" letter-spacing="2" font-family="'Georgia', serif">MUSEUMSBAHN MUSTERDORF</text>
  <text x="150" y="248" text-anchor="middle" font-size="10" font-weight="bold" fill="#E8D080" letter-spacing="4" font-family="'Georgia', serif">MbMd</text>

  <!-- Stars decoration -->
  <text x="55" y="245" text-anchor="middle" font-size="10" fill="#E8D080">★</text>
  <text x="245" y="245" text-anchor="middle" font-size="10" fill="#E8D080">★</text>

  <!-- Year badge -->
  <circle cx="150" cy="108" r="18" fill="#1C1C2E" stroke="#C8A030" stroke-width="1.5"/>
  <text x="150" y="106" text-anchor="middle" font-size="7" fill="#C8A030" font-family="'Georgia', serif">EST.</text>
  <text x="150" y="116" text-anchor="middle" font-size="9" font-weight="bold" fill="#E8D080" font-family="'Georgia', serif">1890</text>
</svg>
