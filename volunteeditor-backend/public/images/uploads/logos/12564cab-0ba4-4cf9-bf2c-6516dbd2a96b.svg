<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#F5E8D0"/>
    </radialGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B3A2A"/>
      <stop offset="100%" stop-color="#4A2515"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5C3020"/>
      <stop offset="100%" stop-color="#3A1A08"/>
    </linearGradient>
    <radialGradient id="foamGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#F0E0C0"/>
      <stop offset="100%" stop-color="#D4B890"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="300" height="300" fill="url(#bg7)"/>

  <!-- Decorative coffee bean pattern in bg -->
  <ellipse cx="55" cy="80" rx="10" ry="16" fill="#D4B090" opacity="0.2" transform="rotate(30,55,80)"/>
  <line x1="51" y1="66" x2="59" y2="94" stroke="#C09060" stroke-width="1.5" opacity="0.2" transform="rotate(30,55,80)"/>

  <ellipse cx="245" cy="90" rx="10" ry="16" fill="#D4B090" opacity="0.2" transform="rotate(-20,245,90)"/>
  <line x1="241" y1="76" x2="249" y2="104" stroke="#C09060" stroke-width="1.5" opacity="0.2" transform="rotate(-20,245,90)"/>

  <ellipse cx="60" cy="220" rx="8" ry="13" fill="#D4B090" opacity="0.15" transform="rotate(15,60,220)"/>
  <ellipse cx="240" cy="215" rx="8" ry="13" fill="#D4B090" opacity="0.15" transform="rotate(-25,240,215)"/>

  <!-- Saucer -->
  <ellipse cx="150" cy="182" rx="60" ry="12" fill="#8B5E3C"/>
  <ellipse cx="150" cy="180" rx="56" ry="9" fill="#A0723C"/>
  <ellipse cx="150" cy="180" rx="35" ry="5" fill="#8B5E3C"/>

  <!-- Cup body -->
  <path d="M105,130 L115,178 L185,178 L195,130 Z" fill="url(#cupGrad)" rx="4"/>
  <path d="M105,130 Q150,125 195,130" fill="#8B5040"/>

  <!-- Coffee surface -->
  <ellipse cx="150" cy="132" rx="42" ry="10" fill="url(#coffeeGrad)"/>

  <!-- Latte art - heart in the foam -->
  <ellipse cx="150" cy="133" rx="38" ry="8" fill="url(#foamGrad)"/>
  <!-- Heart latte art -->
  <path d="M150,130 C150,130 145,126 141,128 C137,130 137,134 141,136 L150,143 L159,136 C163,134 163,130 159,128 C155,126 150,130 150,130Z" fill="#8B4520" opacity="0.6"/>

  <!-- Cup handle -->
  <path d="M193,142 Q220,142 220,160 Q220,178 193,176" fill="none" stroke="url(#cupGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M193,142 Q215,142 215,160 Q215,175 193,175" fill="none" stroke="#7A4A2A" stroke-width="6" stroke-linecap="round"/>

  <!-- Steam wisps -->
  <path d="M128,122 Q122,110 130,100 Q138,90 132,80" fill="none" stroke="#C09060" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M150,120 Q144,106 152,96 Q160,86 154,74" fill="none" stroke="#C09060" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M172,122 Q178,110 170,100 Q162,90 168,80" fill="none" stroke="#C09060" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Text -->
  <text x="150" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#6B3A2A" font-family="'Georgia', serif" letter-spacing="0.5">ALLES FÜR</text>
  <text x="150" y="236" text-anchor="middle" font-size="20" font-weight="900" fill="#4A2515" font-family="'Georgia', serif" letter-spacing="1">DIE BOHNE</text>
  <text x="150" y="254" text-anchor="middle" font-size="9" fill="#A0723C" letter-spacing="4" font-family="sans-serif">SOZIALCAFÉ</text>
</svg>
